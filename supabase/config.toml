# Configuración del entorno LOCAL de Supabase (npx supabase start).
project_id = "yupiii"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Bandeja de correo local para ver invitaciones y recuperaciones: http://127.0.0.1:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Aula privada: no hay registro público. Las cuentas las crea el profesor.
enable_signup = false

[auth.email]
enable_signup = true   # necesario para que el backend cree cuentas con correo
double_confirm_changes = true
enable_confirmations = false
max_frequency = "60s"

[auth.email.template.recovery]
subject = "Restablecer contraseña · Reyinisyalize modpas · Réinitialiser le mot de passe"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Invitación a Yupiii · Envitasyon Yupiii · Invitation Yupiii"
content_path = "./supabase/templates/invite.html"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
